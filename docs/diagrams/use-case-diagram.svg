<text x="904" y="372" font-size="19" font-weight="bold" text-anchor="start" fill="#1F2933"><tspan x="904" dy="0.0">Notes</tspan></text>
<circle cx="910" cy="408" r="4" fill="#1F2933"/>
<text x="926" y="414" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">Every use case except Sign in needs</tspan><tspan x="926" dy="20.0">a signed-in account.</tspan></text>
<circle cx="910" cy="464" r="4" fill="#1F2933"/>
<text x="926" y="470" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">A hollow arrow points from an actor to</tspan><tspan x="926" dy="20.0">the actor it inherits use cases from.</tspan></text>
<circle cx="910" cy="520" r="4" fill="#1F2933"/>
<text x="926" y="526" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">Clinic Staff and Doctor can do everything</tspan><tspan x="926" dy="20.0">a Clinic User can.</tspan></text>
<circle cx="910" cy="576" r="4" fill="#1F2933"/>
<text x="926" y="582" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">The Clinic Coordinator can do everything</tspan><tspan x="926" dy="20.0">Clinic Staff and the Doctor can, plus</tspan><tspan x="926" dy="20.0">the coordinator-only use cases.</tspan></text>
<circle cx="910" cy="652" r="4" fill="#1F2933"/>
<text x="926" y="658" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">Nurses and student assistants share</tspan><tspan x="926" dy="20.0">the Clinic Staff role.</tspan></text>
<circle cx="910" cy="708" r="4" fill="#1F2933"/>
<text x="926" y="714" font-size="16" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="926" dy="0.0">Patients do not use the system:</tspan><tspan x="926" dy="20.0">clinic staff enter their details.</tspan></text>
<ellipse cx="460" cy="1622" rx="40" ry="17" fill="#E3EEF9" stroke="#2D6297" stroke-width="2.5"/>
<text x="514" y="1628" font-size="18" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="514" dy="0.0">Use case</tspan></text>
<ellipse cx="670" cy="1622" rx="40" ry="17" fill="#FFFFFF" stroke="#2D6297" stroke-width="2.5"/>
<text x="724" y="1628" font-size="18" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="724" dy="0.0">Included or extending use case</tspan></text>
<line x1="1040" y1="1622" x2="1110" y2="1622" stroke="#1F2933" stroke-width="2"/>
<text x="1124" y="1628" font-size="18" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="1124" dy="0.0">Association</tspan></text>
<path d="M1270,1622 L1350,1622" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round" marker-end="url(#hollow)"/>
<text x="1364" y="1628" font-size="18" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="1364" dy="0.0">Generalisation</tspan></text>
<path d="M1540,1622 L1620,1622" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="1634" y="1628" font-size="18" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="1634" dy="0.0">Include / extend</tspan></text>
</svg>
