<path d="M1271.8,1430 L1351.8,1430" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1365.8" y="1437" font-size="19" font-weight="normal" text-anchor="start" fill="#1F2933"><tspan x="1365.8" dy="0.0">Data flow</tspan></text>
<text x="1050.0" y="1492" font-size="18" font-weight="normal" text-anchor="middle" fill="#52606D" font-style="italic"><tspan x="1050.0" dy="0.0">Patients (students and employees) are the subject of the records but do not use the system: clinic staff enter their details.</tspan><tspan x="1050.0" dy="26.1">The Clinic Coordinator can also do everything Clinic Staff and the Doctor can; only the coordinator's own flows are drawn.</tspan></text>
