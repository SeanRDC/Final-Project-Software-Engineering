<line x1="240" y1="1380" x2="1860" y2="1380" stroke="#CBD2D9" stroke-width="2"/>
<rect x="647.8" y="1410" width="70" height="40" fill="#FCF0D3" stroke="#D9962F" stroke-width="3"/>
