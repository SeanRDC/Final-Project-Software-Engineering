<path d="M1760,873 L1290,873" fill="none" stroke="#1F2933" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1525.0" y="864.0" font-size="21" font-weight="normal" text-anchor="middle" fill="#1F2933" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"><tspan x="1525.0" dy="0.0">Appointment confirmation or cancellation</tspan></text>
<path d="M1760,957 L1290,957" fill="none" stroke="#1F2933" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1525.0" y="921.75" font-size="21" font-weight="normal" text-anchor="middle" fill="#1F2933" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"><tspan x="1525.0" dy="0.0">Report period to generate</tspan><tspan x="1525.0" dy="26.2">(semester or summer)</tspan></text>
