<text x="1910.0" y="1030.3999999999999" font-size="18" font-weight="normal" text-anchor="middle" fill="#5B3A0A"><tspan x="1910.0" dy="0.0">(Administrator)</tspan></text>
<rect x="810" y="170" width="480" height="1160" rx="46" fill="#2D6297" stroke="#1F4670" stroke-width="4"/>
