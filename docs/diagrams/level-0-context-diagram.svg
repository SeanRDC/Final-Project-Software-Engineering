<text x="1050.0" y="770" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">1.0  Manage Patient Records</tspan></text>
<text x="1050.0" y="832" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">2.0  Manage Appointments</tspan></text>
<text x="1050.0" y="894" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">3.0  Record Visits and Consultations</tspan></text>
<text x="1050.0" y="956" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">4.0  Manage Medicine Inventory</tspan></text>
<text x="1050.0" y="1018" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">5.0  Generate Reports and Statistics</tspan></text>
<text x="1050.0" y="1080" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">6.0  Sign In and Display Dashboard</tspan></text>
<text x="1050.0" y="1142" font-size="23" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">7.0  Manage Accounts and Audit Log</tspan></text>
