<text x="190.0" y="778.6" font-size="18" font-weight="normal" text-anchor="middle" fill="#5B3A0A"><tspan x="190.0" dy="0.0">(Nurse / Student Assistant)</tspan></text>
<rect x="1760" y="170" width="300" height="400" fill="#FCF0D3" stroke="#D9962F" stroke-width="3"/>
<text x="1910.0" y="363.0" font-size="28" font-weight="bold" text-anchor="middle" fill="#5B3A0A"><tspan x="1910.0" dy="0.0">Doctor</tspan></text>
<text x="1910.0" y="398.6" font-size="18" font-weight="normal" text-anchor="middle" fill="#5B3A0A"><tspan x="1910.0" dy="0.0">(Attending Physician)</tspan></text>
