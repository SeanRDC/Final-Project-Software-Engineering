<text x="1050.0" y="470" font-size="58" font-weight="bold" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">HAU-Sync</tspan></text>
<text x="1050.0" y="530" font-size="30" font-weight="normal" text-anchor="middle" fill="#FFFFFF"><tspan x="1050.0" dy="0.0">Patient Record</tspan><tspan x="1050.0" dy="36.0">Management and</tspan><tspan x="1050.0" dy="36.0">Appointment System</tspan></text>
<line x1="880" y1="660" x2="1220" y2="660" stroke="#9DB8D6" stroke-width="2"/>
