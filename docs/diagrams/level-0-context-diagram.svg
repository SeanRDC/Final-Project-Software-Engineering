<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1560" viewBox="0 0 2100 1560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">HAU-Sync Level 0 context diagram</title>
<desc id="desc">The HAU-Sync system as one process with its three external entities: Clinic Staff, Doctor and Clinic Coordinator, and every data flow between them.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 Z" fill="#1F2933"/></marker>
<marker id="open" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13" fill="none" stroke="#1F2933" stroke-width="2"/></marker>
<marker id="hollow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="20" refX="21" refY="10" orient="auto"><path d="M1,1 L21,10 L1,19 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/></marker>
</defs>
<rect width="2100" height="1560" fill="#FFFFFF"/>
<text x="1050.0" y="62" font-size="38" font-weight="bold" text-anchor="middle" fill="#1F2933"><tspan x="1050.0" dy="0.0">Level 0 Diagram (Context Diagram)</tspan></text>
<text x="1050.0" y="102" font-size="22" font-weight="normal" text-anchor="middle" fill="#52606D"><tspan x="1050.0" dy="0.0">HAU-Sync: Patient Record Management and Appointment System</tspan></text>
